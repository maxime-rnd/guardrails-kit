[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrails-kit"
version = "0.1.0"
description = "Composable transform, extraction, and check pipelines for AI applications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.31.0",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardrails_kit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes the `examples` package importable from the project root.
pythonpath = ["."]
